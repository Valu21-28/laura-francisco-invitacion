<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura & Francisco</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff8f2;
    color:#333;
    text-align:center;
}

img.portada{
    width:100%;
    display:block;
}

section{
    max-width:900px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h2{
    color:#6d5238;
}

.btn{
    display:inline-block;
    margin-top:15px;
    background:#8b6a47;
    color:white;
    padding:14px 24px;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.regalo{
    background:#f8efe8;
    border-radius:12px;
    padding:12px;
    margin:10px 0;
}
</style>

</head>
<body>

<img src="portada.png" class="portada">

<section>

<div class="card">

<h2>Confirma tu asistencia</h2>

<p>Presiona el botón para confirmar por WhatsApp.</p>

<a class="btn"
href="https://wa.me/56954542318?text=Hola,%20confirmo%20mi%20asistencia%20a%20la%20inauguración%20de%20casa%20de%20Laura%20y%20Francisco.">
Confirmar asistencia
</a>

</div>

<div class="card">

<h2>Lista de regalos</h2>

<div id="lista"></div>

</div>

</section>

<script>

const telefono="56954542318";

const regalos=[
"Juguera",
"Tabla para cocinar plástica",
"Juego de servicio",
"Vasos",
"Utensilios de silicona",
"Rallador de cocina",
"Bowls",
"Tostador",
"Cuchillos",
"Frascos",
"Contenedores",
"Pelador",
"Cuchara de palo",
"Exprimidor",
"Basurero baño",
"Paños de cocina",
"Jarro",
"Panera",
"Colador",
"Uslero",
"Individuales",
"Copas",
"Vasos de postre",
"Plancha",
"Organizadores",
"Ensaladeras",
"Toallas",
"Sábanas Súper King",
"Cubreplumón Súper King",
"Cubrecama Súper King"
];

let lista=document.getElementById("lista");

regalos.forEach(function(regalo){

let mensaje=encodeURIComponent(
"Hola, quiero regalar: "+regalo
);

lista.innerHTML+=`
<div class="regalo">
<b>🎁 ${regalo}</b><br><br>
<a class="btn"
href="https://wa.me/${telefono}?text=${mensaje}">
Reservar regalo
</a>
</div>
`;

});

</script>

</body>
</html>
